<main class="card">
  <h1>Redefinir senha</h1>
  <p>Crie uma nova senha para sua conta Blessed Store.</p>

  <div id="formArea" class="hide">
    <form id="passwordForm">
      <label for="password">Nova senha</label>
      <input id="password" type="password"
        minlength="8" autocomplete="new-password"
        required placeholder="Mínimo de 8 caracteres">

      <label for="confirmPassword">Confirmar nova senha</label>
      <input id="confirmPassword" type="password"
        minlength="8" autocomplete="new-password"
        required placeholder="Digite a senha novamente">

      <button id="saveBtn" type="submit">

      </button>
    </form>
  </div>

  <div id="status" class="status">
    Verificando link de recuperação...
  </div>

  <p id="loginLink" class="hide">

    </a>
  </p>

<script>
(async () => {
  const SUPABASE_URL =
    "https://wdetfogymnbnbhaulhxv.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_2_SbUgb59iK3K-Vfc5xwqA_YVjfYKJ6";

  const sb = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        detectSessionInUrl: true,
        flowType: "pkce"
      }
    }
  );

  const $ = id => document.getElementById(id);

  function showStatus(message, type = "") {
    $("status").textContent = message;
    $("status").className = "status " + type;
  }

  let recoveryAuthorized = false;

  // Detecta o tipo de recuperação tanto na query quanto no hash.
  function hasRecoveryType() {
    const query = new URLSearchParams(location.search);
    const hash = new URLSearchParams(
      location.hash.replace(/^#/, "")
    );

    return (
      query.get("type") === "recovery" ||
      hash.get("type") === "recovery"
    );
  }

  // O Supabase pode enviar um código PKCE na URL.
  async function processRecoveryLink() {
    const params = new URLSearchParams(location.search);
    const code = params.get("code");

    if (code) {
      const { error } =
        await sb.auth.exchangeCodeForSession(code);

      if (error) {
        throw new Error(
          "O link de recuperação não pôde ser validado. " +
          "Solicite um novo e-mail."
        );
      }

      recoveryAuthorized = true;

      // Remove o código da barra de endereço após validá-lo.
      history.replaceState(
        null,
        "",
        location.pathname
      );
    }

    if (hasRecoveryType()) {
      recoveryAuthorized = true;
    }
  }

  // O fluxo tradicional pode retornar tokens no hash.
  sb.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
      recoveryAuthorized = true;
      checkRecovery();
    }
  });

  async function checkRecovery() {
    try {
      await processRecoveryLink();

      const { data, error } = await sb.auth.getSession();

      if (error) throw error;

      if (!data.session || !recoveryAuthorized) {
        $("formArea").classList.add("hide");

        showStatus(
          "O link de recuperação não foi reconhecido ou expirou.\n\n" +
          "Solicite um novo e-mail de recuperação e abra o link " +
          "no mesmo navegador."
        );

        return;
      }

      $("formArea").classList.remove("hide");

      showStatus(
        "Link validado! Agora você pode criar sua nova senha."
      );

    } catch (error) {
      showStatus(error.message, "error");
    }
  }

  $("passwordForm").addEventListener("submit", async event => {
    event.preventDefault();

    const password = $("password").value;
    const confirmPassword = $("confirmPassword").value;

    if (password.length < 8) {
      showStatus(
        "A senha precisa ter pelo menos 8 caracteres.",
        "error"
      );
      return;
    }

    if (password !== confirmPassword) {
      showStatus(
        "As senhas não são iguais. Confira e tente novamente.",
        "error"
      );
      return;
    }

    if (!recoveryAuthorized) {
      showStatus(
        "O link de recuperação não foi validado.",
        "error"
      );
      return;
    }

    $("saveBtn").disabled = true;
    showStatus("Salvando nova senha...");

    try {
      const { error } = await sb.auth.updateUser({
        password: password
      });

      if (error) throw error;

      $("formArea").classList.add("hide");
      $("loginLink").classList.remove("hide");

      showStatus(
        "Senha alterada com sucesso!\n\n" +
        "Agora acesse a importação e entre com sua nova senha.",
        "success"
      );

      $("password").value = "";
      $("confirmPassword").value = "";

    } catch (error) {
      showStatus(
        "Não foi possível alterar a senha: " + error.message,
        "error"
      );
    } finally {
      $("saveBtn").disabled = false;
    }
  });

  await checkRecovery();
})();
</script>
</body>
